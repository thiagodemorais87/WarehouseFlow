services:
  db:
    image: postgres:16-alpine
    container_name: warehouseflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouseflow
    ports:
      - "5433:5432"
    volumes:
      - warehouseflow_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U warehouse -d warehouseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations idempotentes (001, 002, 003…) a cada `up`.
  # Banco novo: no-op. Volume antigo: alinha ao schema.sql atual sem `down -v`.
  migrate:
    image: postgres:16-alpine
    container_name: warehouseflow-migrate
    restart: "no"
    environment:
      PGPASSWORD: warehouse
    volumes:
      - ./backend/database/migrations:/migrations:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        for f in /migrations/*.sql; do
          echo "aplicando $$f"
          psql -h db -U warehouse -d warehouseflow -v ON_ERROR_STOP=1 -q -f "$$f"
        done
        echo "migrations ok"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: warehouseflow-api:${APP_VERSION:-dev}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: warehouseflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # .env é opcional: num clone limpo o Compose sobe só com os defaults abaixo
    env_file:
      - path: .env
        required: false
    environment:
      # Override host URL from .env: inside the network the DB is always `db:5432`
      DATABASE_URL: postgresql+psycopg2://warehouse:warehouse@db:5432/warehouseflow
      SECRET_KEY: ${SECRET_KEY:-altere-esta-chave-em-desenvolvimento}
      FRONTEND_DIR: /app/frontend
      APP_VERSION: ${APP_VERSION:-dev}
    labels:
      org.opencontainers.image.title: WarehouseFlow
      org.opencontainers.image.version: ${APP_VERSION:-dev}
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: nginx:alpine
    container_name: warehouseflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  warehouseflow_pgdata:
