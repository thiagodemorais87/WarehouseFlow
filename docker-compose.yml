services:
  db:
    image: postgres:16-alpine
    container_name: warehouseflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouseflow
    ports:
      - "5433:5432"
    volumes:
      - warehouseflow_pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouseflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: warehouseflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host URL from .env: inside the network the DB is always `db:5432`
      DATABASE_URL: postgresql+psycopg2://warehouse:warehouse@db:5432/warehouseflow
      SECRET_KEY: ${SECRET_KEY:-sua_chave_secreta_super_segura_aqui}
      FRONTEND_DIR: /app/frontend
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: warehouseflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  warehouseflow_pgdata:
