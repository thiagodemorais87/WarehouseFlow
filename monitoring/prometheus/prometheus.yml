global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: blackbox
    metrics_path: /metrics
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: warehouseflow-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # Em staging/prod com Nginx: http://frontend/health
          # Dev/lab: API direta na rede Compose
          - http://api:8000/health
        labels:
          probe: health
          app: warehouseflow
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: warehouseflow-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8000/ready
        labels:
          probe: ready
          app: warehouseflow
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
