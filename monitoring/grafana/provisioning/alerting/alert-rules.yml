# Regras de alerta do Grafana (enviam e-mail pelo Contact Point warehouseflow-email).
# Equivalentes às regras de monitoring/prometheus/alerts.yml, que não têm Alertmanager.
#
# Cada regra: A = consulta Prometheus instantânea; B = reduce (last); C = threshold (gt 0).
# O modificador "bool" faz a comparação devolver 1 quando o problema existe e 0 quando não,
# assim a condição C é sempre "gt 0". Thresholds e janelas "for" podem ser ajustados aqui.
apiVersion: 1

groups:
  - orgId: 1
    name: warehouseflow-infra
    folder: WarehouseFlow
    interval: 1m
    rules:
      - uid: wf-target-down
        title: Target Prometheus fora do ar
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'up == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Target Prometheus fora do ar"
          description: "Job {{ $labels.job }} instance {{ $labels.instance }} está down há mais de 5 minutos."
        labels:
          severity: warning

      - uid: wf-health-failing
        title: WarehouseFlow /health falhou
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'probe_success{probe="health",app="warehouseflow"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "WarehouseFlow /health falhou"
          description: "Probe HTTP /health sem sucesso."
        labels:
          severity: critical

      - uid: wf-ready-failing
        title: WarehouseFlow /ready falhou
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'probe_success{probe="ready",app="warehouseflow"} == bool 0'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "WarehouseFlow /ready falhou"
          description: "Probe HTTP /ready sem sucesso (API ou PostgreSQL)."
        labels:
          severity: critical

      - uid: wf-host-high-memory
        title: Memória do host acima de 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > bool 0.90'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memória do host acima de 90%"
          description: "Uso de memória do host Debian > 90%."
        labels:
          severity: warning

      - uid: wf-host-disk-low
        title: Disco com menos de 10% livre
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: '(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < bool 0.10'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Disco com menos de 10% livre"
          description: "Filesystem {{ $labels.mountpoint }} com pouco espaço."
        labels:
          severity: warning
