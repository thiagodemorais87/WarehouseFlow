<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WarehouseFlow</title>

    <link
    rel="stylesheet"
    href="{{ url_for('static', path='css/global.css') }}"
>

<link
    rel="stylesheet"
    href="{{ url_for('static', path='css/login.css') }}"
>
    
</head>

<body>
    <main class="login-page">

        <section class="login-container">

            <div class="brand">
                <div class="brand-icon">
                    <svg
                    width="22"
                    height="22"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    
                    <path
                    d="M6 8V6C6 2.686 8.686 1 12 1C15.314 1 18 2.686 18 6V8"
                    stroke="white"
                    stroke-width="2"
                    />

                    <rect
                    x="4"
                    y="7"
                    width="16"
                    height="14"
                    rx="2"
                    stroke="white"
                    stroke-width="2"
                    />
                    </svg>
                </div>

                <span>WarehouseFlow</span>
            </div>

            <div class="login-header">
                <h1>Bem-vindo ao WarehouseFlow</h1>
                <p>Gerencie seu armazém de forma simples e eficiente</p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Digite seu email" required
                    >
                </div>

                <div class="form-group">
                    <label for="password">senha</label>

                    <div class="password-field">
                        <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        >

                        <button
    type="button"
    class="password-toggle"
    id="passwordToggle"
    aria-label="Mostrar senha"
>
    <!-- Olho aberto -->
    <svg
        id="eyeOpen"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >
        <path
            d="M2 12C4.5 7.5 7.8 5.5 12 5.5C16.2 5.5 19.5 7.5 22 12C19.5 16.5 16.2 18.5 12 18.5C7.8 18.5 4.5 16.5 2 12Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
        />

        <circle
            cx="12"
            cy="12"
            r="2.5"
            stroke="currentColor"
            stroke-width="1.8"
        />
    </svg>

    <!-- Olho fechado -->
    <svg
        id="eyeClosed"
        class="hidden"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
    >
        <path
            d="M3 3L21 21"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        />

        <path
            d="M10.6 5.7C11.05 5.57 11.52 5.5 12 5.5C16.2 5.5 19.5 7.5 22 12C21.35 13.17 20.63 14.17 19.83 15"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        />

        <path
            d="M17 17.3C15.5 18.1 13.84 18.5 12 18.5C7.8 18.5 4.5 16.5 2 12C2.87 10.43 3.9 9.13 5.08 8.12"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
        />
    </svg>
</button>
                </div>
            </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox" name="remember">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#">Esqueci minha senha</a>
                    
                </div>

                <button type="submit" class="login-button">Entrar</button>

            </form>
            
        </section>

    </main>
    
    <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>

</html>
