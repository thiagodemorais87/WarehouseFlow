# Staging e produção: use project names e env files distintos.
#
# Staging:
#   docker compose -p warehouseflow-staging --env-file .env.staging -f docker-compose.prod.yml up -d --build
#
# Produção:
#   docker compose -p warehouseflow-production --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Diretórios no host (Debian/EC2):
#   /opt/warehouseflow/staging
#   /opt/warehouseflow/production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./backend/database/optimization_runs.sql:/docker-entrypoint-initdb.d/03-optimization_runs.sql:ro
      - ./backend/database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem ports: — PostgreSQL não é publicado na internet.

  api:
    image: warehouseflow-api:${APP_VERSION:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      FRONTEND_DIR: /app/frontend
      APP_VERSION: ${APP_VERSION:-latest}
      APP_ENV: ${APP_ENV}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    labels:
      org.opencontainers.image.title: WarehouseFlow
      org.opencontainers.image.version: ${APP_VERSION:-latest}
    # Código incorporado na imagem — sem bind mounts.
    # API só na rede Docker interna — sem ports: 8000.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: warehouseflow-nginx:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
